<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncify</title>
    <link rel="stylesheet" href="../../static/css/default.css" type="text/css">
    <link rel="stylesheet" href="./routes/404/404.css" type="text/css">
    <link rel='icon' href="/static/images/icon.png">
    <script src="../../static/js/default.js"></script>
    <script src='./routes/user/user.js'></script>
  </head>
  <body>
    <header>
      <a href="/">
        <div class="brand">
          <img src="../../static/images/icon.png" alt="account icon" class="account-icon">
          <h1>Syncify</h1>
        </div>
      </a>
      <div class="account">
        <input type="checkbox" id="toggle-menu" class="toggle-menu">
        <label for="toggle-menu" class="account-label">
          <p class="username">{{user.name}}</p>
          <img src="{{user.image}}" alt="account icon" class="account-icon" id="profile-icon">
        </label>
        <div class="dropdown-menu" id="dropdown-menu">
          <a href="{{user.url}}" target="_blank">Profile</a>
          <a href="/logout">Logout</a>
          <div class="theme-toggle" onclick="toggleTheme()">
            <img id="theme-icon" src="https://img.icons8.com/material-outlined/24/ffffff/moon--v1.png" alt="theme toggle icon" class="theme-icon">
          </div>
        </div>
      </div>
    </header>
    <div class="container">
        <div class="textError">
          <h1>OH NO!</h1>
          <p>You are accessing a page that does not exist. <br> Go back to use our site as it should and on PAGES THAT EXIST!</p>
        </div>
        <div class="imageError">
          <img src="./routes/404/images/mascotte.png" alt="">
        </div>
    </div>
    <footer>
      <div class="reportbug-container">
        <a class="reportbug" href="/bugreport">Contact us</a>
      </div>
    </footer>
  </body>
</html>
